name: CI

on:
  push:
    branches: [main, "kv-based"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  licenses:
    name: Licenses (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses

  advisories:
    name: Advisories (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check advisories (vulns / yanks)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories
