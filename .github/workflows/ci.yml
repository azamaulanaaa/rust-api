name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build docs (rustdoc is denied; broken links fail too)
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run doc tests
        run: cargo test --locked --doc

  licenses:
    name: Licenses (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses

  advisories:
    name: Advisories (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check advisories (vulns / yanks)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories

  bans:
    name: Duplicate dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # `bans` is configured with multiple-versions = "warn", so duplicate
      # transitive versions are surfaced in the log without failing the job.
      # The strict parts (wildcard requirements, license conflicts) do fail.
      - name: Check for duplicate/banned dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: bans
