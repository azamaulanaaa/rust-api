# The workspace root. The server package lives under crates/server. The
# model and core crates build for the server and for wasm32. The client
# crate builds for the browser.
[workspace]
members = [
    "crates/model",
    "crates/core",
    "crates/server",
    "crates/client",
]
# The edition 2024 resolver.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/rust-api"
publish = false

[workspace.dependencies]
# The path dependencies carry a version, because the deny check refuses a
# wildcard path dependency.
rust-api-model = { version = "0.1.0", path = "crates/model" }
rust-api-core = { version = "0.1.0", path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde"] }

# Enforce rustdoc on every public item in every crate.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The profile that 'dist' will build with.
[profile.dist]
inherits = "release"
lto = "thin"

# Casbin enables Rhai features that remove the limits, the function calls,
# and the 64-bit integers that the condition script engine needs. The local
# copy keeps the casbin source and changes only the Rhai features.
[patch.crates-io]
casbin = { path = "vendor/casbin" }
