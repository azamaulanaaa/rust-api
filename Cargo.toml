[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust-api"
path = "src/main.rs"

[features]
default = ["otlp-http"]
otlp-grpc = ["dep:opentelemetry-otlp", "opentelemetry-otlp/grpc-tonic", "opentelemetry-otlp/trace", "opentelemetry-otlp/metrics", "opentelemetry-otlp/internal-logs"]
otlp-http = ["dep:opentelemetry-otlp", "opentelemetry-otlp/http-proto", "opentelemetry-otlp/trace", "opentelemetry-otlp/metrics", "opentelemetry-otlp/internal-logs"]

[dependencies]
actix-web = "4.12.0"
bytes = "1.11"
futures-util = "0.3.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5.8"

async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"

base64 = "0.22.1"
casbin = "2.20.0"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }

aws-config = { version = "1.8", default-features = false, features = ["rt-tokio", "rustls", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.117", default-features = false, features = ["rt-tokio", "rustls", "http-1x", "default-https-client"] }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
oxkv = { version = "0.3", features = ["otel"] }

opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", optional = true, default-features = false }
opentelemetry_sdk = "0.32.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

chrono = "0.4"
uuid = { version = "1.18", features = ["v7", "serde"] }

utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }

anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
rand = "0.8.0"
rsa = "0.9.10"
wiremock = "0.6.5"

# Enforce rustdoc on every public item across all targets (lib + bin).
[lints.rust]
missing_docs = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
