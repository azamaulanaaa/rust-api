[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust-api"
path = "src/main.rs"

[dependencies]
actix-web = "4.12.0"
anyhow = "1.0.100"
casbin = "2.20.0"
clap = { version = "4.5.53", features = ["derive"] }
futures-util = "0.3.31"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
openidconnect = "4.0.1"
reqwest = { version = "0.12", features = [ "json"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9.8"
opentelemetry = "0.32.0"
oxkv = "0.2.0"
async-trait = "0.1"
serde_json = "1.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "trace", "metrics", "internal-logs"] }
opentelemetry_sdk = "0.32.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

base64 = "0.22.1"

[dev-dependencies]
base64 = "0.22.1"
rand = "0.8.0" 
rsa = "0.9.10"
serde_json = "1.0.149"
wiremock = "0.6.5"

# Enforce rustdoc on every public item across all targets (lib + bin).
[lints.rust]
missing_docs = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
