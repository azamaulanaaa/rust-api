[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The lib and bin targets are picked up from `src/lib.rs` and `src/main.rs`
# by cargo's defaults, so no [lib]/[[bin]] table is needed.

[features]
default = ["otlp-http"]
otlp-grpc = ["dep:opentelemetry-otlp", "opentelemetry-otlp/grpc-tonic", "opentelemetry-otlp/trace", "opentelemetry-otlp/metrics", "opentelemetry-otlp/internal-logs"]
otlp-http = ["dep:opentelemetry-otlp", "opentelemetry-otlp/http-proto", "opentelemetry-otlp/trace", "opentelemetry-otlp/metrics", "opentelemetry-otlp/internal-logs"]

# Version floors are `major.minor`: a new minor is a deliberate bump, patch
# releases float. Exact versions are pinned by the committed Cargo.lock and
# the `--locked` CI jobs, so nothing resolves differently between runs.
[dependencies]
actix-web = "4.12"
actix-cors = "0.7"
# Range, not a floor: actix-web-codegen 4.4.0 generates route structs
# without docs, tripping `[lints.rust] missing_docs = "deny"`. Revisit on
# 4.4.1+/actix-web 5.
actix-web-codegen = ">=4.3.0, <4.4.0"
bytes = "1.11"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"

async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

base64 = "0.22"
casbin = "2.20"
sha2 = "0.10"
jsonwebtoken = { version = "10.2", features = ["rust_crypto"] }
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "rustls-tls"] }

object_store = { version = "0.12", default-features = false, features = ["aws"] }
# `btree` is named explicitly because oxkv 0.9 re-exports `CachedOxKvStore`,
# `CachedTx` and `WarmMode` only under
# `all(feature = "oxkv", feature = "btree")`, and `src/fs/store.rs` builds a
# `CachedOxKvStore` with `WarmMode::Lazy`. The item resolves today only
# because the oxkv default feature happens to include `btree`. Naming it here
# keeps the build correct if that default ever changes.
oxkv = { version = "0.9", features = ["btree", "oxkv", "oxkv-s3", "otel"] }

opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false }
opentelemetry_sdk = "0.32"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = "0.4"
uuid = { version = "1.18", features = ["v7", "serde"] }
rand = "0.8"

utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
rsa = "0.9"
wiremock = "0.6"

# Enforce rustdoc on every public item across all targets (lib + bin).
[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
