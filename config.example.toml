# Example configuration for rust-api.
#
# Copy this file to config.toml, fill in the secrets, and start with:
#   cargo run -- serve --config config.toml
#
# Every field below carries its purpose and default. Optional fields are
# commented out. Uncomment and edit the ones you need.
#
# Secrets may also come from the environment. A value that is present and
# not empty wins over the value in this file:
#   RUST_API_CLIENT_SECRET
#   RUST_API_SETUP_TOKEN
#   RUST_API_S3_ACCESS_KEY_ID
#   RUST_API_S3_SECRET_ACCESS_KEY
#   RUST_API_CAPABILITY_SECRET
#   RUST_API_CAPABILITY_SECRET_PREV
#   RUST_API_EAV_WEBHOOK_SIGNING_SECRET
#   RUST_API_ALLOWED_ORIGINS  (comma-separated list of origins)

# Public base URL of this deployment. Used to build the OIDC redirect.
# Must be an http(s) URL.
public_address = "https://example.com"

# TCP port that the HTTP listener binds to.
listen_port = 8080

[authorization]
# OAuth2 client identifier registered at the provider.
client_id = "rust-api"

# OAuth2 client secret registered at the provider.
# Override with RUST_API_CLIENT_SECRET.
client_secret = "change-me"

# Base URL of the OIDC discovery document at the provider.
issuer_url = "https://idp.example.com"

# Tenant identifiers accepted by this deployment. Required only when
# issuer_url is a multi-tenant template such as
# https://login.microsoftonline.com/{tenantid}/v2.0. Ignored for a
# single-tenant issuer. Default: [].
# allowed_tenants = ["tenant-a"]

# Bootstrap secret for POST /setup/admin. The route requires this value in
# the X-Setup-Token header. The route is absent when the field is unset.
# The value must have at least 32 bytes. Generate with:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
# Override with RUST_API_SETUP_TOKEN. Default: none, which disables the
# route.
# setup_token = "<32+ byte secret>"

[database]
# Object prefix inside the S3 bucket for OxKV keys. Default: "oxkv".
prefix = "oxkv"

# Size of the shared SST block cache, in MiB. One cache serves every OxKV
# handle in the process, so the handle count does not multiply this budget.
# 0 disables SST caching. The server sets the size before it builds the first
# handle, so a later change has no effect on an open handle. Default: 128.
# sst_cache_mb = 128

# Prototype: keep a lazily-warmed in-RAM mirror of the master fs store.
# Costs one master key set in RAM; safe only with a single writer.
# Default: false.
# mirror_master = false

# Seconds a single-writer lease stays valid without renewal. 0 disables
# the lease (safe only on a single process). Default: 60.
# writer_lease_ttl_secs = 60

[s3]
# Storage backend: "s3" (default) or "memory" for local development.
# backend = "memory"

# S3 bucket name.
bucket = "my-bucket"

# AWS region, for example us-east-1.
region = "us-east-1"

# Custom endpoint for S3-compatible providers (MinIO, R2). Omit for AWS.
# Default: none.
# endpoint_url = "http://localhost:9000"

# Use path-style addressing. MinIO requires it. Default: false.
# force_path_style = false

# Access key ID. Falls back to RUST_API_S3_ACCESS_KEY_ID or an instance
# profile when absent. Default: none.
# access_key_id = "minioadmin"

# Secret access key. Falls back to RUST_API_S3_SECRET_ACCESS_KEY. Default:
# none.
# secret_access_key = "minioadmin"

[observability]
# Service name attached to every exported telemetry resource.
# Default: "rust-api".
service_name = "rust-api"

# OTLP collector endpoint. Span export is off when absent. Transport follows
# the compiled cargo feature (otlp-http or otlp-grpc). Default: none.
# otlp_endpoint = "http://localhost:4318"

# Fraction of traces sampled, between 0.0 and 1.0. Default: 1.0.
sample_ratio = 1.0

[capability]
# Current signing secret for capability tokens (file-delegation JWTs). It
# must be 64 hex characters (32 bytes). Generate with:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
# Override with RUST_API_CAPABILITY_SECRET. Omit for an ephemeral OS-RNG
# key per boot (tokens die with the process). Default: none.
# secret = "<64 hex chars>"

# Previous signing secret, used only to verify tokens during a rotation.
# Override with RUST_API_CAPABILITY_SECRET_PREV. Default: none.
# previous_secret = "<64 hex chars>"

[http]
# Browser origins allowed by CORS. Empty means same-origin only. Each
# origin must be an http(s) URL without a trailing slash. Credentials are
# always allowed. Override with RUST_API_ALLOWED_ORIGINS (comma-separated).
# Default: [].
# allowed_origins = ["https://app.example.com", "http://localhost:5173"]

# Serve /openapi.json and /swagger-ui/*. Both routes answer without
# authentication. Keep this false in production unless the deployment needs
# the document. Default: false.
# expose_docs = false

[limits]
# Requests per minute for each peer address, after an initial burst of the
# same size. 0 disables the bucket. Default: 0.
# rate_per_minute = 0

# Highest burst allowed before the refill rate applies. 0 means "same as
# rate_per_minute". Default: 0.
# rate_burst = 0

# Concurrent downloads of /sync/db/{object}. 0 disables the gate. Default: 0.
# max_concurrent_downloads = 0

# Largest stored EAV replica, in bytes, that one full GET /eav/sync/replica
# read may load. A larger replica returns 400 with code "replica_too_large".
# The client must then read chunks with ?chunk=N. A read at the limit is
# allowed. 0 disables the gate. Default: 0.
# max_full_replica_bytes = 0

# Concurrent job status streams. 0 selects the built-in default, 32. It does
# not disable the gate. Default: 32.
# max_job_event_streams = 32

# Longest job status stream, in seconds. The stream also closes when the
# token expires. 0 selects the built-in default, 900. It does not remove the
# cap. Default: 900.
# job_event_stream_max_secs = 900

# Job status streams that one subject may hold at the same time. The
# process-wide cap still applies. 0 selects the built-in default, 8. It does
# not disable the gate. Default: 8.
# max_job_event_streams_per_subject = 8

# Milliseconds between job status stream polls. The value must be within
# 100..=60000. A shorter interval sends changes sooner and reads the full job
# row more often. 0 selects the built-in default, 1000. Default: 1000.
# job_event_stream_poll_ms = 1000

[eav]
# Pause in milliseconds between outbox flushes. Must be above 0.
# Default: 1000.
# outbox_interval_ms = 1000

# Pause in milliseconds between rule runner polls. Must be above 0.
# Default: 200.
# rule_poll_interval_ms = 200

# Pause in milliseconds between execution marker cleanups. The cleanup covers
# the rule store and the entity-store script markers. Must be above 0.
# Default: 3600000.
# gc_interval_ms = 3600000

# Retention window in seconds for execution markers in both stores. Must be
# above 0. Values below 604800 (7 days) log a warning. A shorter window can
# delete a marker before a replay reads it, so the action can run twice. The
# server does not reject the value. Keep it longer than any replay window for
# WAL events. Default: 2592000.
# execution_retention_secs = 2592000

# Pause in milliseconds between due timer passes. Must be above 0.
# Default: 1000.
# timer_interval_ms = 1000

# Largest number of due entities to read for each time index key.
# Must be above 0. Default: 100.
# timer_batch = 100

# Maximum causation depth for a rule chain. The maximum is inclusive. The
# value must be within 1..=64. Default: 8.
# max_causation_depth = 8

# Enables sandboxed Rhai condition scripts. With false, the server rejects a
# script condition at save time. A stored script condition then fails at run
# time. Default: false.
# script_enabled = false

# Checks that each EntityRef target exists on a write. With false, a write
# still validates the target form and skips only the existence read.
# Default: true.
# check_entity_refs = true

# Hosts that a webhook rule can call. Each value is a host or a host:port pair.
# An entry with no port matches only the default port of the URL scheme: 80 for
# http and 443 for https. An empty list rejects every webhook rule. Default:
# empty.
# webhook_allowed_hosts = ["example.com", "example.com:8443"]

# Optional HMAC-SHA256 secret for webhook signing. It must have at least
# 32 bytes. Default: none, which sends no signature header. Set
# RUST_API_EAV_WEBHOOK_SIGNING_SECRET to inject it from the environment.
# webhook_signing_secret = "change-me-32-bytes-or-longer"

# Maximum delivery attempts for one webhook job. It must be within 1..=20.
# Default: 5.
# webhook_max_attempts = 5

# Allows webhook delivery to a private, loopback, or link-local address.
# The action still resolves the host and pins the address. Set this value to
# true only for an intentional internal webhook. Default: false.
# webhook_allow_private_hosts = false

# Optional — RabbitMQ connection for the job queue. Only used when the
# binary is built with the `queue-rabbitmq` cargo feature.
# [rabbitmq]
# url = "amqp://guest:guest@localhost:5672"
