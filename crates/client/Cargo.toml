[package]
name = "rust-api-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "WASM client for the rust-api server"

[lib]
# The cdylib is the browser artifact. The rlib keeps the crate testable
# and usable from a native test target.
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-api-model.workspace = true
rust-api-core.workspace = true
# The client reads the replica objects through the read-only oxkv reader.
# Default features only: do not add `oxkv-s3` or `object_store` to WASM.
oxkv = "0.12"
# The read-only storage adapter implements the oxkv `Storage` trait.
async-trait = "0.1"
# The entity view decodes the stored rows and builds the query result.
serde.workspace = true
# The replica loader parses the manifest and verifies each object.
serde_json.workspace = true
sha2.workspace = true

# The JS binding and the browser transport are WebAssembly-only
# dependencies. The native test target does not build them. Keep this
# target-specific: do not add a Cargo feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# The generated async binding runs the checked future on the browser loop.
wasm-bindgen-futures = "0.4"
# The HTTP feature adds the `fetch` wrapper only. The default features add
# JSON, WebSocket, and EventSource support, which this client does not need.
gloo-net = { version = "0.8", default-features = false, features = ["http"] }
# The credential mode and redirect mode types are `web-sys` types. Enable
# only those bindings.
web-sys = { version = "0.3", features = ["RequestCredentials", "RequestRedirect"] }

[lints]
workspace = true
