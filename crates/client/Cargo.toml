[package]
name = "rust-api-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "WASM client for the rust-api server"

[lib]
# The cdylib is the browser artifact. The rlib keeps the crate testable
# and usable from a native test target.
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-api-model.workspace = true
rust-api-core.workspace = true

# The JS binding is a WebAssembly-only dependency. The native test target
# does not build it. Keep this target-specific: do not add a Cargo feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true
