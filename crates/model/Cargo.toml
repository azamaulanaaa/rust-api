[package]
name = "rust-api-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared wire contract for the rust-api server and the WASM client"

[features]
# The default build carries no OpenAPI dependency. Only the server turns
# this feature on.
default = []
openapi = ["dep:utoipa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
utoipa = { version = "6", optional = true }

[lints]
workspace = true
