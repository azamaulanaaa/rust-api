[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[advisories]
version = 2
yanked = "deny"

[[advisories.ignore]]
id = "RUSTSEC-2026-0258"
reason = """
h2: unbounded empty DATA frames allow memory exhaustion. Fixed in h2 >= 0.4.16, \
but every published actix-http through 3.18.12 requires h2 ^0.3.27, so no \
actix-web release can carry the fix yet. h2 IS compiled in (actix-web enables \
its http2 feature by default) and reachable by any client that speaks h2c to \
this listener, so the exposure is real rather than theoretical. Mitigation \
today is to terminate HTTP/2 in front of this process. Re-check when \
actix-web moves off h2 0.3.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0194"
reason = """
quick-xml: quadratic runtime scanning a start tag for duplicate attribute \
names, a denial-of-service. Fixed in quick-xml >= 0.41.0. quick-xml is reached \
only through object_store, and object_store is at 0.12.5 because the vendored \
oxkv-s3 0.12.1 adapter declares Arc<dyn object_store::ObjectStore> in its \
public API and object_store 0.12.5 requires quick-xml ^0.38. This crate also \
calls the object_store 0.12 S3 builder directly. So the fix needs a port of \
both paths to a newer object_store. Both this and RUSTSEC-2026-0195 are \
response-parsing DoS: triggering one requires the S3 endpoint to return a \
crafted XML body, and the S3 origin is a configured, trusted endpoint (AWS, \
or a MinIO/R2 the operator controls).
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0195"
reason = """
quick-xml: unbounded namespace-declaration allocation in NsReader, a \
memory-exhaustion denial of service. Fixed in quick-xml >= 0.41.0. Same \
upstream block as RUSTSEC-2026-0194: object_store 0.12.5 is the version that \
the vendored oxkv-s3 0.12.1 adapter and the S3 builder of this crate both \
use, and object_store 0.12.5 requires quick-xml ^0.38. So the fix cannot be \
taken until both paths move to a newer object_store. Response-parsing only, \
from a trusted S3 origin.
"""

[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
reason = """
rsa: the Marvin attack recovers an RSA private key from decryption timing. \
No patched version of `rsa` exists at all, so this can never be bumped away. \
The vulnerable path is RSA private-key decryption, which this crate does not \
perform: JWTs are verified as RS256 against public keys fetched from the \
provider's JWKS. There is no RSA signing outside tests either -- the OIDC \
flow is authorization-code with PKCE, with no encrypted ID tokens and no \
private_key_jwt client assertion. Recorded rather than ignored silently \
because a future change adding client-assertion signing would make this \
reachable and it would then need a real answer.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0249"
reason = """
smartstring is unmaintained (archived May 2026), all versions affected, and no \
replacement is offered upstream. Reached through casbin -> rhai, and casbin \
2.20.0 is the latest published release, so it cannot be dropped by bumping. \
The compensating control is that rhai only ever evaluates RBAC_MODEL, a \
compile-time constant in src/policy/mod.rs -- no request-derived or \
attacker-controlled expression reaches the evaluator, which is the only way a \
parser DoS in that path would be exploitable.
"""

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[[advisories.ignore]]
id = "RUSTSEC-2026-0387"
reason = """
crypto-bigint: timing variability in constant-time operations. Reached through \
jsonwebtoken and openidconnect via elliptic-curve. No patched version is \
available within the current dependency constraints; RSA/ECDSA verification uses \
public keys and does not perform secret-dependent operations on attacker input.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0542"
reason = """
humantime is unmaintained. All versions are affected. The advisory offers no \
safe upgrade. The path is oxkv-s3 0.12.1 -> object_store 0.12.5 -> humantime \
2.4.0. The vendored oxkv-s3 adapter exposes object_store types in its public \
API. That fact pins object_store at 0.12.5. The migration cost is a port of both \
the adapter and the S3 builder to a newer object_store. Review this entry when \
that port lands.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0543"
reason = """
chrono is unmaintained. All versions are affected. The advisory offers no safe \
upgrade. Two paths reach it. oauth2 and openidconnect use it for token time \
handling. object_store 0.12.5 uses it for metadata timestamps. The advisory \
suggests jiff and time as alternatives. The migration cost is a change to the \
OIDC client and to the vendored oxkv-s3 adapter and S3 builder. Review this \
entry when those paths move off chrono.
"""
