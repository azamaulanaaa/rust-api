[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[advisories]
version = 2
yanked = "deny"

[[advisories.ignore]]
id = "RUSTSEC-2026-0258"
reason = """
h2 accepts empty DATA frames without a limit. These frames allow memory \
exhaustion. The defect is fixed in h2 0.4.16 and later. Every published \
actix-http release through 3.18.12 requires h2 ^0.3.27. Thus no actix-web \
release can carry the fix now. actix-web enables the http2 feature of h2 by \
default, so h2 is in the build. Any client that speaks h2c to this listener can reach the \
vulnerable path. The exposure is real. The current control is to terminate \
HTTP/2 in front of this process. Review this entry when actix-web moves off \
h2 0.3.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0194"
reason = """
quick-xml has a quadratic runtime when it scans a start tag for duplicate \
attribute names. This condition is a denial of service. The defect is fixed in \
quick-xml 0.41.0 and later. This crate reaches quick-xml only through \
object_store. The vendored oxkv-s3 0.12.1 adapter declares \
Arc<dyn object_store::ObjectStore> in its public API. Thus object_store stays \
at 0.12.5, and that release requires quick-xml ^0.38. This crate also calls \
the object_store 0.12 S3 builder directly. The fix needs a port of both paths \
to a newer object_store. This advisory and RUSTSEC-2026-0195 are \
response-parsing denial-of-service faults. An attacker must make the S3 \
endpoint return a crafted XML body. The S3 origin is a configured endpoint \
that the operator trusts, such as AWS, MinIO, or R2.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0195"
reason = """
quick-xml does not limit the allocation for namespace declarations in \
NsReader. This condition is a memory-exhaustion denial of service. The defect \
is fixed in quick-xml 0.41.0 and later. The same upstream block as \
RUSTSEC-2026-0194 applies. The vendored oxkv-s3 0.12.1 adapter and the S3 builder of this crate \
both use object_store 0.12.5. That release requires quick-xml ^0.38. Thus \
this project cannot take the fix until both paths move to a newer \
object_store. An attacker must reach this path through response parsing only. \
The S3 origin is trusted.
"""

[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
reason = """
rsa is open to the Marvin attack. This attack recovers an RSA private key \
from decryption timing. No patched version of rsa exists, so no dependency \
bump can remove this advisory. The vulnerable path is RSA private-key \
decryption. This crate does not perform that operation. This crate verifies \
JWTs as RS256 against public keys from the provider JWKS. This crate does no \
RSA signing outside tests. The OIDC flow is authorization-code with PKCE. It \
has no encrypted ID tokens and no private_key_jwt client assertion. This \
project records the entry and does not ignore it in silence. A future change \
that adds client-assertion signing would make the path reachable. That change \
would need a real answer.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0249"
reason = """
smartstring is unmaintained and upstream archived it in May 2026. All \
versions are affected. Upstream offers no replacement. This crate reaches \
smartstring through casbin and then rhai. casbin 2.20.0 is the latest release, \
so a dependency bump cannot remove it. The compensating control limits the \
exposure. rhai evaluates only RBAC_MODEL, a compile-time constant in \
src/policy/mod.rs. No request-derived expression reaches the evaluator. No \
attacker-controlled expression reaches the evaluator. A parser denial of \
service in that path is exploitable only through such an expression.
"""

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[[advisories.ignore]]
id = "RUSTSEC-2026-0387"
reason = """
crypto-bigint has timing variability in its constant-time operations. This \
crate reaches crypto-bigint through jsonwebtoken and openidconnect, and then \
through elliptic-curve. No patched version is available within the current \
dependency constraints. RSA and ECDSA verification uses public keys. It does \
not perform secret-dependent operations on attacker input.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0542"
reason = """
humantime is unmaintained. All versions are affected. The advisory offers no \
safe upgrade. The dependency path is oxkv-s3 0.12.1, then object_store 0.12.5, \
then humantime 2.4.0. The vendored oxkv-s3 adapter exposes object_store types \
in its public API. That fact pins object_store at 0.12.5. The migration cost \
is a port of the adapter and the S3 builder to a newer object_store. Review \
this entry when that port lands.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0543"
reason = """
chrono is unmaintained. All versions are affected. The advisory offers no safe \
upgrade. Two paths reach chrono. oauth2 and openidconnect use chrono for token \
time handling. object_store 0.12.5 uses chrono for metadata timestamps. The \
advisory suggests jiff and time as alternatives. The migration cost is a \
change to the OIDC client and to the vendored oxkv-s3 adapter and S3 builder. \
Review this entry when those paths move off chrono.
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0594"
reason = """
cookie 0.16.2 can reuse a private cookie nonce after fork. Fixed in cookie \
0.18.3, but every actix-web release through 4.20.0 requires cookie ^0.16, so \
no patched version can be selected by a dependency bump. This crate builds \
only plain cookies through Cookie::build; it never uses PrivateJar or \
SignedJar, and it does not call fork(). The vulnerable path is therefore not \
reachable. Re-check when actix-web accepts cookie 0.18.
"""
