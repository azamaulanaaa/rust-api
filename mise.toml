[tools]
rust = { version = "stable", components = "rust-analyzer" }
zig = "latest"
"cargo:cargo-zigbuild" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-deny" = "latest"
# Keep in sync with `cargo-dist-version` in dist-workspace.toml.
"cargo:cargo-dist" = "0.30.2"

[tasks]
# Local builds link with zig; CI and the dist release profile use plain
# cargo. Only `build`/`run`/`test` go through cargo-zigbuild -- the plugin
# forwards anything it does not recognize straight to cargo, so wrapping
# `deny` or `llvm-cov` in it worked by accident and is not written that
# way anymore.
build = { run = "cargo-zigbuild build" }
run = { run = "cargo-zigbuild run" }
test = { run = "cargo-zigbuild test" }
cov = { run = "cargo llvm-cov" }
licenses = { run = "cargo deny check licenses" }
advisories = { run = "cargo deny check advisories" }
bans = { run = "cargo deny check bans" }
# Release artifacts (see dist-workspace.toml). `mise run dist init`
# regenerates the GitHub release workflow pinned to the same version.
dist-plan = { run = "cargo dist plan" }
dist-build = { run = "cargo dist build" }
